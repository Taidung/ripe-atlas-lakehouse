[project]
name = "ripe-atlas-lakehouse"
version = "0.1.0"
description = "Batch lakehouse pipeline for RIPE Atlas built-in ping measurements to K-root and F-root"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dlt[filesystem]==1.32.0",
    "prometheus-client==0.26.0",
    "requests==2.34.2",
    "s3fs==2026.9.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.17.5",
]
# Image ripe-atlas-transform (transformation/Dockerfile): runner + dbt trên Trino. Cài bằng `uv sync --only-group transform`.
transform = [
    "dbt-core==1.12.7",
    "dbt-trino==1.12.0",
    "trino==0.340.0",
    "prometheus-client==0.26.0",
    "s3fs==2026.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/ingestion", "tests/transformation"]
pythonpath = [".", "transformation"]
markers = [
    "live: gọi RIPE Atlas API thật (chạy riêng, không chạy trong PR checks)",
    "integration: cần stack Docker đang chạy",
]
addopts = "-m 'not live and not integration'"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP017"]  # E501 bật: dòng tối đa 140 ký tự (line-length)

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "lakehouse", "ripe_atlas", "provision", "tests"]
