services:
  spark-iceberg:
    # Spark 3.5.5 / Scala 2.12.18 / Java 17.0.14 / Iceberg 1.8.1 (đã đo trong container, xem docs/compatibility.md).
    # Build từ spark/Dockerfile: base tabulario/spark-iceberg pin digest + jar S3A nhúng sẵn.
    build: ./spark
    image: ripe-atlas-spark:3.5.5-iceberg1.8.1
    restart: unless-stopped
    ports:
      - "8889:8888"
      - "4040:4040"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_PROCESSING_ACCESS_KEY:?Set S3_PROCESSING_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_PROCESSING_SECRET_KEY:?Set S3_PROCESSING_SECRET_KEY in .env}
      AWS_REGION: us-east-1
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      # Mã nguồn mount chỉ đọc: job ở /opt/app/spark/jobs, package dùng chung ở /opt/app/spark/lakehouse.
      - ./spark:/opt/app/spark:ro
      - ./sql:/opt/app/sql:ro
      - ./tests:/opt/app/tests:ro
      - ./config:/opt/app/config:ro
      # Kết quả GX (validation results, Data Docs HTML); không commit.
      - ./artifacts:/opt/app/artifacts
    networks:
      - lakehouse
    depends_on:
      nessie:
        condition: service_healthy
      init-buckets:
        condition: service_completed_successfully

  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.8@sha256:aee5e959530b60d5e9bceb444e0b0edc8cb3cadd74a3a3e930e28591288d60da
    restart: unless-stopped
    ports:
      - "19120:19120"
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC2
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: nessie
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: ${NESSIE_POSTGRES_PASSWORD:?Set NESSIE_POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19120/api/v2/config"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lakehouse

  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: ${NESSIE_POSTGRES_PASSWORD:?Set NESSIE_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessie -d nessie"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse

  master:
    image: chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0 # SeaweedFS 4.53
    restart: unless-stopped
    ports:
      - "9333:9333"
    command:
      - master
      - -ip=master
      - -ip.bind=0.0.0.0
      - -port=9333
      - -mdir=/data
      - -volumeSizeLimitMB=1024
      - -defaultReplication=000
    volumes:
      - master_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - lakehouse

  volume:
    image: chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0 # SeaweedFS 4.53
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: 
      - volume
      - -master=master:9333
      - -ip=volume
      - -ip.bind=0.0.0.0
      - -port=8080
      - -dataCenter=dc1
      - -rack=rack1
      - -dir=/data
      - -max=0
      - -index=leveldb
    volumes:
      - volume_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      master:
        condition: service_healthy
    networks:
      - lakehouse
  
  filer:
    image: chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0 # SeaweedFS 4.53
    restart: unless-stopped
    ports:
      - "8888:8888"
    command:
      - filer
      - -master=master:9333
      - -ip=filer
      - -ip.bind=0.0.0.0
      - -port=8888
      - -dataCenter=dc1
      - -rack=rack1
      - -defaultStoreDir=/data
    volumes:
      - filer_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8888/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      master:
        condition: service_healthy
      volume:
        condition: service_healthy
    networks:
      - lakehouse
  
  s3:
    image: chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0 # SeaweedFS 4.53
    restart: unless-stopped
    ports:
      - "8333:8333"
    command:
      - s3
      - -filer=filer:8888
      - -ip=s3
      - -ip.bind=0.0.0.0
      - -port=8333
      - -port.iceberg=0
      - -port.lance=0
      - -config=/etc/seaweedfs/s3.json
    env_file: .env
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      master:
        condition: service_healthy
      volume:
        condition: service_healthy
      filer:
        condition: service_healthy
    networks:
      - lakehouse

  init-buckets:
    image: amazon/aws-cli:2.27.41@sha256:bc6b7bba44ce38f9604ede49c584824af919047ea03fbcc7c7610671fdef95d8
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY:?Set S3_ADMIN_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_KEY:?Set S3_ADMIN_SECRET_KEY in .env}
    command:
      - |
        for bucket in staging warehouse; do
          aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$$bucket" 2>/dev/null ||
            aws --endpoint-url http://s3:8333 s3api create-bucket --bucket "$$bucket"
        done
    depends_on:
      s3:
        condition: service_healthy
    networks:
      - lakehouse

  # ---------------------------------------------------------------- jobs
  # Job ingestion chạy theo lệnh: docker compose run --rm ingestion <command> ...
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    image: ripe-atlas-ingestion:0.2
    profiles: ["jobs", "all"]
    environment:
      # Chỉ identity atlas-ingest (ghi staging); không truyền khóa khác.
      S3_INGEST_ACCESS_KEY: ${S3_INGEST_ACCESS_KEY:?Set S3_INGEST_ACCESS_KEY in .env}
      S3_INGEST_SECRET_KEY: ${S3_INGEST_SECRET_KEY:?Set S3_INGEST_SECRET_KEY in .env}
      STAGING_S3_ENDPOINT: http://s3:8333
      STAGING_BUCKET: staging
      PROBE_SET_VERSION: ${PROBE_SET_VERSION:-dev-200-v1}
      OVERLAP_HOURS: ${OVERLAP_HOURS:-3}
      ATLAS_CONCURRENCY: ${ATLAS_CONCURRENCY:-2}
    volumes:
      # Mount để sinh probe set mới vào repo và dùng code mới nhất mà không cần build lại.
      - ./config:/opt/app/config
      - ./ingestion:/opt/app/ingestion:ro
      - ./tests:/opt/app/tests:ro
    depends_on:
      s3:
        condition: service_healthy
    networks:
      - lakehouse

  # ---------------------------------------------------------------- analytics
  trino:
    image: trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    profiles: ["analytics", "all"]
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # Trino chỉ đọc warehouse: dùng identity atlas-reader (Read/List warehouse).
      S3_SERVING_ACCESS_KEY: ${S3_SERVING_ACCESS_KEY:?Set S3_SERVING_ACCESS_KEY in .env}
      S3_SERVING_SECRET_KEY: ${S3_SERVING_SECRET_KEY:?Set S3_SERVING_SECRET_KEY in .env}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      nessie:
        condition: service_healthy
      s3:
        condition: service_healthy
    networks:
      - lakehouse

  superset-db:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    profiles: ["analytics", "all"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:?Set SUPERSET_DB_PASSWORD in .env}
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse

  superset-init:
    build: ./superset
    image: ripe-atlas-superset:6.1.0
    profiles: ["analytics", "all"]
    command: ["sh", "/app/docker/superset-init.sh"]
    # Chỉ truyền đúng biến Superset cần, không dùng env_file để tránh lộ khóa S3.
    environment: &superset_environment
      SUPERSET_CONFIG_PATH: /app/docker/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY in .env}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?Set SUPERSET_DB_PASSWORD in .env}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD in .env}
    volumes: &superset_volumes
      - ./superset/superset_config.py:/app/docker/superset_config.py:ro
      - ./superset/superset-init.sh:/app/docker/superset-init.sh:ro
    depends_on:
      superset-db:
        condition: service_healthy
      trino:
        condition: service_healthy
    networks:
      - lakehouse

  superset:
    image: ripe-atlas-superset:6.1.0
    profiles: ["analytics", "all"]
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment: *superset_environment
    volumes: *superset_volumes
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      superset-init:
        condition: service_completed_successfully
    networks:
      - lakehouse

networks:
  lakehouse:
    driver: bridge

volumes:
  master_data:
  volume_data:
  filer_data:
  postgres_data:
  superset_db_data:
