spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.nessie               org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.catalog-impl  org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.nessie.uri           http://nessie:19120/api/v2
spark.sql.catalog.nessie.ref           main
spark.sql.catalog.nessie.warehouse     s3://warehouse/warehouse
spark.sql.catalog.nessie.io-impl       org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.nessie.s3.endpoint   http://s3:8333
spark.sql.catalog.nessie.s3.path-style-access true
spark.sql.defaultCatalog               nessie
# Jar S3A được nhúng sẵn trong image (spark/Dockerfile), không tải từ Maven lúc chạy.
spark.jars                              /opt/spark/extra-jars/hadoop-aws-3.3.4.jar,/opt/spark/extra-jars/aws-java-sdk-core-1.12.262.jar,/opt/spark/extra-jars/aws-java-sdk-s3-1.12.262.jar,/opt/spark/extra-jars/aws-java-sdk-sts-1.12.262.jar,/opt/spark/extra-jars/aws-java-sdk-dynamodb-1.12.262.jar,/opt/spark/extra-jars/aws-java-sdk-kms-1.12.262.jar,/opt/spark/extra-jars/jmespath-java-1.12.262.jar,/opt/spark/extra-jars/jackson-annotations-2.12.6.jar,/opt/spark/extra-jars/jackson-core-2.12.6.jar,/opt/spark/extra-jars/jackson-databind-2.12.6.1.jar,/opt/spark/extra-jars/wildfly-openssl-1.0.7.Final.jar
# event_time lưu UTC; mọi job Spark dùng session timezone UTC.
spark.sql.session.timeZone              UTC
spark.hadoop.fs.s3a.endpoint            http://s3:8333
spark.hadoop.fs.s3a.path.style.access   true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider
