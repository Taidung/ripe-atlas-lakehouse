# Prometheus: chỉ thu metric. Cảnh báo được đánh giá bởi Grafana Alerting
# (monitoring/grafana/provisioning/alerting/rules.yaml), runbook: docs/runbook.md.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metric job batch (ingest/bronze/silver/gold). honor_labels giữ nhãn job/stage do job tự đặt.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Trino: OpenMetrics tại /metrics, cần header X-Trino-User (đã kiểm chứng: không có header -> 401).
  - job_name: trino
    metrics_path: /metrics
    http_headers:
      X-Trino-User:
        values: ["prometheus"]
    static_configs:
      - targets: ["trino:8080"]

  # Nessie (Quarkus): metric ở cổng management 9000.
  - job_name: nessie
    metrics_path: /q/metrics
    static_configs:
      - targets: ["nessie:9000"]

  - job_name: seaweedfs_s3
    static_configs:
      - targets: ["s3:9327"]
