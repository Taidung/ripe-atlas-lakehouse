# Mô tả, owner, tag và lineage khai báo cho OpenMetadata. Nguồn sự thật: code các job (đường dẫn ghi trong `via`).
# Lineage ở đây là KHAI BÁO (provenance: declared-from-code), vì Spark OpenLineage chưa map được bảng Iceberg qua
# Nessie catalog sang entity của Trino trong OM (docs/governance.md). Superset -> Gold do connector Superset tự suy ra.

owner_team: data-platform
trino_service: trino_lakehouse
database: nessie
storage_service: seaweedfs_staging

layers:
  Bronze: "Dữ liệu nguồn giữ nguyên văn + metadata thu thập; khử trùng theo nội dung; quarantine."
  Silver: "Chuẩn hóa, star schema, SCD2; kiểm tra chất lượng trước khi công bố."
  Gold: "Mart chỉ chứa tử số/mẫu số cộng được; phục vụ dashboard và SQL client."
  Ops: "Trạng thái công bố và kết quả kiểm tra chất lượng."

tables:
  bronze.ping_result_raw:
    layer: Bronze
    description: "Một dòng = một nội dung result ping duy nhất (record_uid = sha256(msm|probe|ts|raw_sha256)). raw_json là nguyên văn dòng response format=txt của RIPE Atlas. Partition ictrl_dt (giờ VN), measurement_id."
    columns:
      record_uid: "sha256(measurement_id|probe_id|event_ts|raw_sha256); khóa MERGE idempotent"
      raw_json: "Nguyên văn một dòng body format=txt (UTF-8), không serialize lại"
      raw_sha256: "SHA-256 của bytes dòng nguồn, tính trước khi dlt nén"
      event_ts: "timestamp nguồn (Unix giây, theo đồng hồ probe)"
      stored_ts: "stored_timestamp của RIPE Atlas"
      manifest_path: "Manifest staging chứa object nguồn (truy vết)"
  bronze.probe_metadata_raw:
    layer: Bronze
    description: "Snapshot metadata probe theo lần thu thập (không lọc is_public). fetch_status=not_returned khi API không trả probe."
  bronze.measurement_metadata_raw:
    layer: Bronze
    description: "Snapshot metadata 4 measurement 1001/1004/2001/2004; raw_json là nguyên văn body HTTP."
  bronze.quarantine:
    layer: Bronze
    description: "Bản ghi bị cách ly kèm lý do (malformed_json, missing_key, hash_mismatch, ...), manifest nguồn và trạng thái tái xử lý."
  bronze.ingest_manifest:
    layer: Ops
    description: "Audit append-only: mỗi lần Bronze xử lý một manifest staging (số dòng đọc/thêm/đã có/quarantine)."
  silver.fact_ping_result:
    layer: Silver
    description: "Một result của một probe, measurement, timestamp nguồn. Business key (measurement_id, probe_id, event_ts). Định nghĩa: docs/silver-model.md."
    columns:
      result_id: "sha256('ping_result'|measurement_id|probe_id|event_ts); ổn định khi chạy lại"
      packets_sent: "sent của nguồn"
      packets_received: "rcvd của nguồn: reply hợp lệ, không tính duplicate (đã kiểm chứng 44.340/44.340)"
      result_status: "all_received | partial_loss | all_lost | send_error | inconsistent"
      rtt_avg_ms: "avg nguồn nếu >= 0; sentinel -1 -> NULL"
      rtt_sum_ms: "Tổng RTT reply hợp lệ (gộp được)"
      probe_sk: "Phiên bản dim_probe as-of event_time; -1 = unknown member"
      public_status: "public | not_public | unknown theo phiên bản probe as-of"
      clock_suspect: "lts < 0 hoặc stored_ts < event_ts: đồng hồ probe đáng ngờ"
  silver.fact_ping_reply:
    layer: Silver
    description: "Một phần tử của mảng result (reply / duplicate / timeout / error) của bản result đã chọn."
  silver.dim_probe:
    layer: Silver
    description: "SCD Type 2 theo probe_id: country, ASN v4/v6, prefix, is_public, toạ độ. valid_from = observed_at (thời điểm quan sát, không phải thời điểm đổi thật)."
  silver.dim_measurement:
    layer: Silver
    description: "SCD Type 2 cho 4 measurement built-in."
  silver.dim_date:
    layer: Silver
    description: "Lịch theo ngày Asia/Ho_Chi_Minh (2010-2035)."
  silver.dim_time:
    layer: Silver
    description: "1.440 phút trong ngày (time_key = HHmm)."
  gold.quality_hourly_target:
    layer: Gold
    description: "Giờ × cohort × measurement. Chỉ tử số/mẫu số cộng được; tỷ lệ tính lại sau khi group (docs/metric-dictionary.md)."
    columns:
      packets_lost: "Σ(sent - rcvd) trên result có sent > 0"
      packets_sent: "Σ sent trên result có sent > 0 (mẫu số packet loss)"
      results_measured: "Số result có sent > 0 (mẫu số tỷ lệ phản hồi)"
      rtt_count: "Số reply RTT hợp lệ (mẫu số RTT trung bình)"
  gold.quality_hourly_country:
    layer: Gold
    description: "Giờ × cohort × measurement × quốc gia probe (ZZ = chưa biết)."
  gold.quality_hourly_asn:
    layer: Gold
    description: "Giờ × cohort × measurement × ASN theo af (-1 = chưa biết)."
  gold.quality_hourly_probe:
    layer: Gold
    description: "Giờ × cohort × measurement × probe: drill-down và đếm distinct ở mọi phạm vi."
  gold.rtt_histogram_hourly:
    layer: Gold
    description: "Histogram RTT log-bucket (tỉ lệ 1.02) theo giờ × measurement × quốc gia × ASN; percentile gộp được (sai số đo <= ~1,6%)."
  gold.ipv4_ipv6_paired_hourly:
    layer: Gold
    description: "Cặp result IPv4/IPv6 cùng probe, cùng target, |dt| <= 120 s (mutual nearest)."
  gold.coverage_hourly:
    layer: Gold
    description: "Lưới đủ 24 giờ × cohort × measurement: completeness ước tính, data_state, loại trừ, quarantine, trạng thái Silver."
  ops.dq_result:
    layer: Ops
    description: "Kết quả kiểm tra chất lượng (GX + Spark) theo lần chạy, bảng, phạm vi partition; severity critical chặn công bố."
  ops.partition_status:
    layer: Ops
    description: "Trạng thái công bố hiện tại theo (bảng, ngày, measurement): published | published_with_warnings | blocked."

containers:
  ping_result_raw: "s3://staging/ripe_atlas/ping_result_raw (dlt jsonl.gz + manifest, theo window_date/window_hour/msm_id)"
  probe_metadata_raw: "s3://staging/ripe_atlas/probe_metadata_raw"
  measurement_metadata_raw: "s3://staging/ripe_atlas/measurement_metadata_raw"

lineage:
  - {from: "container:ping_result_raw", to: bronze.ping_result_raw, via: transformation/jobs/bronze_ingest.py}
  - {from: "container:ping_result_raw", to: bronze.quarantine, via: transformation/jobs/bronze_ingest.py}
  - {from: "container:ping_result_raw", to: bronze.ingest_manifest, via: transformation/jobs/bronze_ingest.py}
  - {from: "container:probe_metadata_raw", to: bronze.probe_metadata_raw, via: transformation/jobs/bronze_ingest.py}
  - {from: "container:measurement_metadata_raw", to: bronze.measurement_metadata_raw, via: transformation/jobs/bronze_ingest.py}
  - {from: bronze.probe_metadata_raw, to: silver.dim_probe, via: transformation/lakehouse/silver.py build_scd2}
  - {from: bronze.measurement_metadata_raw, to: silver.dim_measurement, via: transformation/lakehouse/silver.py build_scd2}
  - from: bronze.ping_result_raw
    to: silver.fact_ping_result
    via: transformation/lakehouse/silver.py build_fact_result
    columns:
      - {from: [record_uid], to: record_uid}
      - {from: [raw_json], to: packets_sent}
      - {from: [raw_json], to: packets_received}
      - {from: [raw_json], to: rtt_sum_ms}
      - {from: [measurement_id, probe_id, event_ts], to: result_id}
  - {from: silver.dim_probe, to: silver.fact_ping_result, via: transformation/lakehouse/silver.py asof_join}
  - {from: silver.dim_measurement, to: silver.fact_ping_result, via: transformation/lakehouse/silver.py asof_join}
  - {from: bronze.ping_result_raw, to: silver.fact_ping_reply, via: transformation/lakehouse/silver.py build_fact_reply}
  - {from: silver.fact_ping_result, to: silver.fact_ping_reply, via: transformation/lakehouse/silver.py build_fact_reply}
  - from: silver.fact_ping_result
    to: gold.quality_hourly_target
    via: transformation/lakehouse/gold.py quality_target
    columns:
      - {from: [packets_sent], to: packets_sent}
      - {from: [packets_sent, packets_received], to: packets_lost}
      - {from: [valid_rtt_count], to: rtt_count}
      - {from: [rtt_sum_ms], to: rtt_sum_ms}
  - {from: silver.fact_ping_result, to: gold.quality_hourly_country, via: transformation/lakehouse/gold.py quality_country}
  - {from: silver.fact_ping_result, to: gold.quality_hourly_asn, via: transformation/lakehouse/gold.py quality_asn}
  - {from: silver.fact_ping_result, to: gold.quality_hourly_probe, via: transformation/lakehouse/gold.py quality_probe}
  - {from: silver.fact_ping_reply, to: gold.rtt_histogram_hourly, via: transformation/lakehouse/gold.py rtt_histogram}
  - {from: silver.fact_ping_result, to: gold.rtt_histogram_hourly, via: transformation/lakehouse/gold.py rtt_histogram}
  - {from: silver.fact_ping_result, to: gold.ipv4_ipv6_paired_hourly, via: transformation/lakehouse/gold.py paired}
  - {from: silver.fact_ping_result, to: gold.coverage_hourly, via: transformation/lakehouse/gold.py coverage}
  - {from: bronze.ingest_manifest, to: gold.coverage_hourly, via: transformation/jobs/gold_build.py (processed hours)}
  - {from: bronze.quarantine, to: gold.coverage_hourly, via: transformation/jobs/gold_build.py (quarantine_records)}
  - {from: ops.partition_status, to: gold.coverage_hourly, via: transformation/jobs/gold_build.py (silver_status)}
