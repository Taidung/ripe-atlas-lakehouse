version: 2

sources:
  - name: staging_files
    description: >
      File .jsonl.gz do ingestion (dlt) ghi trên s3://staging/ripe_atlas, đọc qua catalog Hive `staging`.
      Bảng ngoài + partition theo thư mục; runner chỉ đăng ký partition của manifest đang xử lý
      (DDL: transformation/sql/staging.sql).
    database: staging
    schema: ripe_atlas
    tables:
      - name: ping_result_raw
        description: Một dòng = một result ping đã stage (window_date/window_hour theo giờ VN, msm_id).
      - name: probe_metadata_raw
        description: Một dòng = một snapshot metadata probe (partition ictrl_dt).
      - name: measurement_metadata_raw
        description: Một dòng = một snapshot metadata measurement (partition ictrl_dt).

  - name: runner
    description: Bảng do runner ghi trước khi gọi dbt (DDL transformation/sql/ops.sql).
    database: "{{ env_var('LAKEHOUSE_CATALOG', 'lakehouse') }}"
    schema: work
    tables:
      - name: bronze_pending_object
        description: >
          Một dòng = một object staging thuộc manifest chưa nạp của lần chạy Bronze hiện tại, kèm thông tin
          manifest để kiểm tra từng bản ghi (measurement, af, cửa sổ giờ, load_id, số dòng đã stage).

  - name: bronze_log
    database: "{{ env_var('LAKEHOUSE_CATALOG', 'lakehouse') }}"
    schema: bronze
    tables:
      - name: ingest_manifest
        description: Nhật ký Bronze, một dòng mỗi lần xử lý một manifest (runner ghi).

  - name: ops
    database: "{{ env_var('LAKEHOUSE_CATALOG', 'lakehouse') }}"
    schema: ops
    tables:
      - name: partition_status
        description: Trạng thái công bố theo (bảng, ngày, measurement); runner ghi.
