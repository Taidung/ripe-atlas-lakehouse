version: 2

seeds:
  - name: probe_set_member
    description: >
      Thành viên các probe set (cohort cố định): một dòng mỗi (probe_set_version, af, probe_id). Sinh từ
      config/probe_sets/*.json bằng transformation/dbt/scripts/build_probe_set_seed.py.
    config:
      column_types:
        probe_set_version: varchar
        af: integer
        probe_id: bigint
  - name: asn_info
    description: >
      Tên nhà mạng theo ASN: as_holder (RIPEstat), isp_name (tên ngắn; viết tay cho ASN Việt Nam), isp_type (ISP,
      Hosting/DC, Khác; chỉ ASN Việt Nam). Sinh bằng transformation/dbt/scripts/build_asn_info_seed.py.
    config:
      column_types:
        asn: bigint
        as_holder: varchar
        isp_name: varchar
        isp_type: varchar
    columns:
      - name: asn
        description: Khoá nối với fact trong gold_cohort; trùng sẽ nhân đôi số liệu Gold.
        data_tests: [unique, not_null]
