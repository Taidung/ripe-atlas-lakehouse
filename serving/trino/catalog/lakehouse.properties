# Catalog GHI của pipeline: cùng Nessie (ref main) và cùng warehouse với catalog `nessie`, nhưng dùng identity
# atlas-processing (đọc staging, ghi warehouse). Chỉ user `transform` (dbt + runner) được dùng catalog này,
# xem serving/trino/rules.json. Superset, DBeaver đọc qua catalog `nessie` chỉ đọc.
connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
iceberg.nessie-catalog.ref=main
iceberg.nessie-catalog.default-warehouse-dir=s3://warehouse/warehouse
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
# Bảo trì: cho phép expire_snapshots / remove_orphan_files với ngưỡng 1 ngày (mặc định 7 ngày).
iceberg.expire-snapshots.min-retention=1d
iceberg.remove-orphan-files.min-retention=1d

fs.native-s3.enabled=true
s3.endpoint=http://s3:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_PROCESSING_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_PROCESSING_SECRET_KEY}
