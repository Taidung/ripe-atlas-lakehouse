# Catalog CHỈ ĐỌC cho người dùng (Superset, DBeaver): nessie.<namespace>.<table>. Cùng Nessie (ref main) và
# cùng warehouse mà catalog ghi `lakehouse` (dbt, user transform) ghi vào.
connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
iceberg.nessie-catalog.ref=main
iceberg.nessie-catalog.default-warehouse-dir=s3://warehouse/warehouse

# Native S3 file system tới SeaweedFS; credentials chỉ đọc (identity atlas-reader).
fs.native-s3.enabled=true
s3.endpoint=http://s3:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_SERVING_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SERVING_SECRET_KEY}
