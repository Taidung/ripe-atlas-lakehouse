# Catalog GHI trỏ vào nhánh Nessie `dqtest` (chỉ dùng cho tests/integration/dq_block_on_branch.sh): test tạo nhánh từ
# main, chạy runner với LAKEHOUSE_CATALOG=lakehouse_dqtest, kiểm tra, rồi xóa nhánh. Ngoài lúc test, nhánh không tồn
# tại và catalog này không truy vấn được. Chỉ user `transform` dùng được (serving/trino/rules.json).
connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
iceberg.nessie-catalog.ref=dqtest
iceberg.nessie-catalog.default-warehouse-dir=s3://warehouse/warehouse
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

fs.native-s3.enabled=true
s3.endpoint=http://s3:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_PROCESSING_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_PROCESSING_SECRET_KEY}
