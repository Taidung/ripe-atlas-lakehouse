# Catalog ĐỌC FILE STAGING (.jsonl.gz do dlt ghi) cho tầng Bronze. Bảng ngoài (external) trỏ vào
# s3://staging/ripe_atlas/<entity>/, partition theo thư mục; runner chỉ đăng ký partition của manifest đang xử lý
# (register_partition), nên Trino không liệt kê toàn bộ lịch sử staging. Metastore dạng file, lưu trong warehouse.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3://warehouse/_trino_hive_metastore
hive.allow-register-partition-procedure=true
hive.non-managed-table-writes-enabled=false

fs.native-s3.enabled=true
s3.endpoint=http://s3:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_PROCESSING_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_PROCESSING_SECRET_KEY}
