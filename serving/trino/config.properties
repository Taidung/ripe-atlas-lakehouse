# Trino single-node cho đồ án. Giữ nguyên cấu hình mặc định của image, thêm giới hạn để một truy vấn
# nặng không chiếm hết JVM (sự cố 2026-11-19: approx_percentile accuracy 0.0001 trên ~800k reply làm
# Trino chạy ở 2 GB / ~700% CPU nhiều phút và không phục vụ được truy vấn khác).
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
cache-manager.config-files=etc/cache-manager-memory.properties

# Heap = 65% của mem_limit (serving/trino/jvm.config) -> ~1,95 GB với mem_limit 3g. Mặc định của image là 80%
# (~2,4 GB), chỉ chừa ~0,6 GB ngoài heap nên container bị kernel OOM-kill khi chạy reconcile cả ngày (2026-11-22).
# 1 GB/truy vấn + headroom 30% heap (~0,6 GB) vẫn nằm trong heap.
query.max-memory=1GB
query.max-memory-per-node=1GB
# Truy vấn dashboard và SQL client cần trả trong vài giây; giới hạn cứng để không treo cả cluster.
query.max-execution-time=5m
query.max-run-time=10m
# Client (Superset, CLI) ngừng poll thì hủy truy vấn sau 2 phút thay vì 5 phút mặc định.
query.client.timeout=2m
