# PR check: offline, xác định (deterministic), không gọi RIPE Atlas API, không cần secrets.
name: ci

on:
  pull_request:
  push:
    branches: ["**"]   # mọi nhánh: push là chạy CI, không cần mở PR
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Cài dependency theo uv.lock
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run --frozen ruff check ingestion transformation serving orchestration observability tests
      - name: Kiểm tra cấu hình Compose (mọi profile, giá trị mẫu)
        run: |
          cp .env.example .env
          docker compose --profile all config -q
      - name: Kiểm tra file cấu hình JSON/YAML
        run: |
          uv run --frozen python -c "import json,glob; [json.load(open(p, encoding='utf-8')) for p in glob.glob('config/probe_sets/*.json') + ['config/metrics.json', 'observability/grafana/dashboards/ripe-pipeline.json']]"
          uv run --frozen python observability/grafana/build_dashboard.py && git diff --exit-code observability/grafana/dashboards/
          uv run --frozen python transformation/dbt/scripts/build_probe_set_seed.py && git diff --exit-code transformation/dbt/seeds/
      - name: Unit + contract test (offline)
        run: uv run --frozen pytest -q --junitxml=reports/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: reports/

  transform-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image transform (runner + dbt-trino, theo uv.lock)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: transformation/Dockerfile
          load: true
          tags: ripe-atlas-transform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: dbt parse (biên dịch toàn bộ model, test, macro; không cần Trino)
        run: |
          docker run --rm --entrypoint dbt ripe-atlas-transform:ci parse --project-dir /opt/app/transformation/dbt --profiles-dir /opt/app/transformation/dbt
      - name: CLI runner nạp được mọi lệnh
        run: docker run --rm ripe-atlas-transform:ci --help
